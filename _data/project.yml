  timeframe: Jan, 2023 &mdash; May, 2023
  description: Spot Package delivery service
  role:
    <ul><li>Collaborated with a five-member team to develop a Python-based autonomous package delivery system for the Boston Dynamics Spot robot using the Spot SDK/API, enabling autonomous navigation, package retrieval, and delivery.</li>
    <li>Implemented GraphNav-based waypoint navigation in Python, guiding Spot through a recorded map of connected waypoints into designated rooms while using its onboard cameras to detect AprilTag fiducial markers as visual delivery-location references.</li>
